    <script>
        const imageUpload = document.getElementById('imageUpload');
        const usernameInput = document.getElementById('usernameInput');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const canvas = document.getElementById('canvas');
        const previewImg = document.getElementById('previewImg');
        const placeholderText = document.getElementById('placeholderText');
        const uploadStatus = document.getElementById('uploadStatus');
        const ctx = canvas.getContext('2d');

        imageUpload.addEventListener('change', () => {
            if (imageUpload.files.length > 0) {
                uploadStatus.innerText = "✓ File Berhasil Dipilih";
                uploadStatus.style.color = "#10b981";
            }
        });

        generateBtn.addEventListener('click', () => {
            // 1. Perbaikan validasi file
            if (!imageUpload.files || imageUpload.files.length === 0) { 
                alert('Unggah screenshot bukti voting dulu!'); 
                return; 
            }
            
            const userImg = new Image();
            const frameImg = new Image();
            
            // 2. PERBAIKAN UTAMA: Menggunakan indeks [0] untuk mengambil file gambar
            userImg.src = URL.createObjectURL(imageUpload.files[0]);
            frameImg.src = 'frame.png';

            // 3. Menggunakan Promise untuk memastikan kedua gambar selesai dimuat bersamaan
            Promise.all([
                new Promise(resolve => userImg.onload = resolve),
                new Promise(resolve => frameImg.onload = resolve)
            ]).then(() => {
                canvas.width = frameImg.width; 
                canvas.height = frameImg.height;

                // Ukuran lubang kotak tengah bingkai tiket merah kamu
                const targetW = frameImg.width * 0.525;
                const targetH = frameImg.height * 0.46;
                const targetX = (frameImg.width - targetW) / 2;
                const targetY = frameImg.height * 0.228;

                // Bersihkan canvas terlebih dahulu sebelum menggambar ulang
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Lapisan belakang: Gambar bukti vote dari user
                ctx.drawImage(userImg, targetX, targetY, targetW, targetH);

                // Lapisan depan: Tempel gambar bingkai tiket merah utama
                ctx.drawImage(frameImg, 0, 0, frameImg.width, frameImg.height);

                // Cetak teks nama di atas pita merah
                const user = usernameInput.value.trim() || '@ARMY';
                ctx.font = `bold ${frameImg.width * 0.035}px 'Inter', sans-serif`;
                ctx.fillStyle = '#ffffff'; 
                ctx.textAlign = 'center'; 
                ctx.textBaseline = 'middle';
                
                // Reset shadow dari settingan sebelumnya (jika ada)
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; 
                ctx.shadowBlur = 4;
                ctx.fillText(user, frameImg.width / 2, frameImg.height * 0.555);

                // Tampilkan hasil cetakan canvas ke elemen gambar pratinjau
                previewImg.src = canvas.toDataURL('image/png');
                placeholderText.classList.add('hidden');
                previewImg.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');

                // Logika download file
                downloadBtn.onclick = () => {
                    const l = document.createElement('a');
                    l.download = `ARMY_VOTE_${user}.png`;
                    l.href = previewImg.src; 
                    l.click();
                };
            }).catch(err => {
                alert("Gagal memuat gambar bingkai atau foto. Pastikan 'frame.png' ada di folder yang sama.");
                console.error(err);
            });
        });
    </script>
